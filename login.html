<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Apex Learning Academy</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body style="background: linear-gradient(160deg, var(--navy-900) 0%, var(--navy-800) 50%, var(--navy-600) 100%); min-height: 100vh;">

<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px;">

    <div style="width: 100%; max-width: 440px;">

        <div style="text-align: center; margin-bottom: 32px;">
            <a href="index.html" style="display: inline-flex; align-items: center; gap: 12px; justify-content: center;">
                <div class="brand-logo"><img src="logo.png" alt="Apex"></div>
                <div class="brand-text" style="text-align: left;">
                    <span class="brand-name">APEX</span>
                    <span class="brand-sub">LEARNING ACADEMY</span>
                </div>
            </a>
        </div>

        <div style="background: var(--white); padding: 44px 40px; border-radius: var(--radius-xl); box-shadow: var(--shadow-xl);">

            <h1 style="font-size: 26px; margin-bottom: 8px; text-align: center;">Welcome Back</h1>
            <p style="font-size: 14.5px; color: var(--text-secondary); text-align: center; margin-bottom: 32px;">Login to access your courses and dashboard.</p>

            <form action="#" method="POST">
                <div style="margin-bottom: 20px;">
                    <label style="display: block; font-size: 14px; font-weight: 600; color: var(--navy-800); margin-bottom: 8px;">Email Address</label>
                    <input type="email" name="email" required placeholder="your@email.com" style="width: 100%; padding: 13px 16px; border: 2px solid var(--gray-200); border-radius: 8px; font-family: inherit; font-size: 15px;">
                </div>

                <div style="margin-bottom: 20px;">
                    <label style="display: block; font-size: 14px; font-weight: 600; color: var(--navy-800); margin-bottom: 8px;">Password</label>
                    <input type="password" name="password" required placeholder="Enter your password" style="width: 100%; padding: 13px 16px; border: 2px solid var(--gray-200); border-radius: 8px; font-family: inherit; font-size: 15px;">
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; font-size: 14px;">
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text-secondary);">
                        <input type="checkbox" style="width: 16px; height: 16px; accent-color: var(--gold-500);">
                        Remember me
                    </label>
                    <a href="#" style="color: var(--teal-500); font-weight: 600;">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg">Login</button>
            </form>

            <div style="text-align: center; margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--border-color);">
                <p style="font-size: 14.5px; color: var(--text-secondary);">Don't have an account?</p>
                <a href="register.html" style="font-weight: 700; color: var(--gold-600); font-size: 15px; margin-top: 6px; display: inline-block;">Create Student Account</a>
            </div>

        </div>

        <p style="text-align: center; color: rgba(255,255,255,0.6); font-size: 13px; margin-top: 24px;">
            &copy; 2026 Apex Learning Academy. All rights reserved.
        </p>

    </div>

</div>
<script type="module">
import { auth } from './firebase-config.js';
import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

document.querySelector('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const submitBtn = e.target.querySelector('button[type="submit"]');
    const originalText = submitBtn.textContent;
    submitBtn.textContent = 'Logging in...';
    submitBtn.disabled = true;

    const email = document.querySelector('input[name="email"]').value.trim();
    const password = document.querySelector('input[name="password"]').value;

    try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = 'dashboard.html';
    } catch (error) {
        console.error('Login error:', error);
        let msg = 'Login failed. ';
        if (error.code === 'auth/user-not-found') msg += 'Email not registered.';
        else if (error.code === 'auth/wrong-password') msg += 'Incorrect password.';
        else if (error.code === 'auth/invalid-email') msg += 'Invalid email address.';
        else if (error.code === 'auth/invalid-credential') msg += 'Invalid email or password.';
        else msg += error.message;
        alert(msg);
        submitBtn.textContent = originalText;
        submitBtn.disabled = false;
    }
});
</script>
</body>
</html>
