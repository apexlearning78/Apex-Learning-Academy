<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Apex Learning Academy</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="mobile.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        .login-error {
            display: none;
            padding: 14px 18px;
            background: #FEF2F2;
            border-left: 4px solid #EF4444;
            border-radius: 8px;
            color: #991B1B;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .login-error.active { display: block; }
        .login-success {
            display: none;
            padding: 14px 18px;
            background: #ECFDF5;
            border-left: 4px solid #10B981;
            border-radius: 8px;
            color: #065F46;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .login-success.active { display: block; }
        .forgot-link {
            color: #00A896;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            background: none;
            border: none;
            font-family: inherit;
            font-size: 14px;
            padding: 0;
        }
        .forgot-link:hover { text-decoration: underline; }
    </style>
</head>
<body style="background: linear-gradient(160deg, #051429 0%, #0A2540 50%, #1a3a5c 100%); min-height: 100vh;">

<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px;">
    <div style="width: 100%; max-width: 440px;">

        <div style="text-align: center; margin-bottom: 32px;">
            <a href="index.html" style="display: inline-flex; align-items: center; gap: 12px; justify-content: center; text-decoration: none;">
                <div style="width: 48px; height: 48px; background: linear-gradient(135deg, #F4B400, #d99f00); border-radius: 12px; display: flex; align-items: center; justify-content: center; overflow: hidden;">
                    <img src="logo.png" alt="Apex" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
                <div style="text-align: left; line-height: 1;">
                    <div style="font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 18px; color: #FFFFFF; letter-spacing: 2px;">APEX</div>
                    <div style="font-size: 9px; color: #F4B400; letter-spacing: 2.5px; font-weight: 600; margin-top: 4px;">LEARNING ACADEMY</div>
                </div>
            </a>
        </div>

        <div style="background: #FFFFFF; padding: 44px 40px; border-radius: 20px; box-shadow: 0 24px 60px rgba(0,0,0,0.35);">

            <h1 id="pageTitle" style="font-family: 'Poppins', sans-serif; font-size: 26px; color: #0A2540; margin-bottom: 8px; text-align: center; font-weight: 800;">Welcome Back</h1>
            <p id="pageSubtitle" style="font-size: 14.5px; color: #64748B; text-align: center; margin-bottom: 32px; font-weight: 500;">Login to access your courses and dashboard.</p>

            <div class="login-error" id="loginError"></div>
            <div class="login-success" id="loginSuccess"></div>

            <!-- LOGIN FORM -->
            <form id="loginForm">
                <div style="margin-bottom: 20px;">
                    <label style="display: block; font-size: 14px; font-weight: 700; color: #0A2540; margin-bottom: 8px;">Email Address</label>
                    <input type="email" name="email" id="emailInput" required placeholder="your@email.com" autocomplete="email" style="width: 100%; padding: 13px 16px; border: 2px solid #E2E8F0; border-radius: 10px; font-family: inherit; font-size: 15px; color: #0A2540; font-weight: 500;">
                </div>

                <div style="margin-bottom: 20px;">
                    <label style="display: block; font-size: 14px; font-weight: 700; color: #0A2540; margin-bottom: 8px;">Password</label>
                    <input type="password" name="password" id="passwordInput" required placeholder="Enter your password" autocomplete="current-password" style="width: 100%; padding: 13px 16px; border: 2px solid #E2E8F0; border-radius: 10px; font-family: inherit; font-size: 15px; color: #0A2540; font-weight: 500;">
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; font-size: 14px;">
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; color: #64748B; font-weight: 500;">
                        <input type="checkbox" style="width: 16px; height: 16px; accent-color: #F4B400;">
                        Remember me
                    </label>
                    <button type="button" class="forgot-link" onclick="showForgotForm()">Forgot password?</button>
                </div>

                <button type="submit" id="loginBtn" style="width: 100%; padding: 15px; border-radius: 10px; font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 15px; letter-spacing: 0.3px; cursor: pointer; border: none; background: linear-gradient(135deg, #F4B400, #d99f00); color: #0A2540; box-shadow: 0 8px 24px rgba(244,180,0,0.32); transition: all 0.25s;">
                    Login
                </button>
            </form>

            <!-- FORGOT PASSWORD FORM -->
            <form id="forgotForm" style="display: none;">
                <div style="margin-bottom: 20px;">
                    <label style="display: block; font-size: 14px; font-weight: 700; color: #0A2540; margin-bottom: 8px;">Email Address</label>
                    <input type="email" id="forgotEmail" required placeholder="your@email.com" autocomplete="email" style="width: 100%; padding: 13px 16px; border: 2px solid #E2E8F0; border-radius: 10px; font-family: inherit; font-size: 15px; color: #0A2540; font-weight: 500;">
                    <p style="font-size: 13px; color: #64748B; margin-top: 8px; line-height: 1.6;">
                        We'll send a password reset link to your email. Check your inbox (and spam folder).
                    </p>
                </div>

                <button type="submit" id="forgotBtn" style="width: 100%; padding: 15px; border-radius: 10px; font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 15px; letter-spacing: 0.3px; cursor: pointer; border: none; background: linear-gradient(135deg, #10B981, #059669); color: #FFFFFF; box-shadow: 0 8px 24px rgba(16,185,129,0.32); transition: all 0.25s; margin-bottom: 10px;">
                    Send Reset Link
                </button>

                <button type="button" onclick="showLoginForm()" style="width: 100%; padding: 13px; border-radius: 10px; font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 14px; cursor: pointer; background: #FFFFFF; color: #64748B; border: 2px solid #E2E8F0;">
                    Back to Login
                </button>
            </form>

            <div id="registerPrompt" style="text-align: center; margin-top: 28px; padding-top: 24px; border-top: 1px solid #E2E8F0;">
                <p style="font-size: 14.5px; color: #64748B; font-weight: 500;">Don't have an account?</p>
                <a href="register.html" style="font-weight: 800; color: #d99f00; font-size: 15px; margin-top: 6px; display: inline-block; text-decoration: none;">Create Student Account</a>
            </div>

        </div>

        <p style="text-align: center; color: rgba(255,255,255,0.6); font-size: 13px; margin-top: 24px; font-weight: 500;">
            &copy; 2026 Apex Learning Academy. All rights reserved.
        </p>

    </div>
</div>

<script type="module">
import { auth } from './firebase-config.js';
import { 
    signInWithEmailAndPassword, 
    sendPasswordResetEmail 
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

// ============ DOM ============
const loginForm = document.getElementById('loginForm');
const forgotForm = document.getElementById('forgotForm');
const loginError = document.getElementById('loginError');
const loginSuccess = document.getElementById('loginSuccess');
const pageTitle = document.getElementById('pageTitle');
const pageSubtitle = document.getElementById('pageSubtitle');
const registerPrompt = document.getElementById('registerPrompt');

// ============ SHOW / HIDE FORMS ============
window.showForgotForm = function() {
    loginForm.style.display = 'none';
    forgotForm.style.display = 'block';
    registerPrompt.style.display = 'none';
    pageTitle.textContent = 'Reset Password';
    pageSubtitle.textContent = 'Enter your email to receive a reset link.';
    loginError.classList.remove('active');
    loginSuccess.classList.remove('active');
};

window.showLoginForm = function() {
    loginForm.style.display = 'block';
    forgotForm.style.display = 'none';
    registerPrompt.style.display = 'block';
    pageTitle.textContent = 'Welcome Back';
    pageSubtitle.textContent = 'Login to access your courses and dashboard.';
    loginError.classList.remove('active');
    loginSuccess.classList.remove('active');
};

// ============ LOGIN ============
loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    loginError.classList.remove('active');
    loginSuccess.classList.remove('active');

    const email = document.getElementById('emailInput').value.trim().toLowerCase();
    const password = document.getElementById('passwordInput').value;
    const loginBtn = document.getElementById('loginBtn');

    if (!email || !password) {
        loginError.textContent = 'Please enter both email and password.';
        loginError.classList.add('active');
        return;
    }

    const originalText = loginBtn.textContent;
    loginBtn.textContent = 'Logging in...';
    loginBtn.disabled = true;
    loginBtn.style.opacity = '0.7';

    try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = 'dashboard.html';
    } catch (error) {
        console.error('Login error:', error.code, error.message);
        
        let msg = 'Login failed. ';
        switch (error.code) {
            case 'auth/user-not-found':
                msg = 'This email is not registered. Please create an account.';
                break;
            case 'auth/wrong-password':
                msg = 'Incorrect password. Try again or use "Forgot password".';
                break;
            case 'auth/invalid-email':
                msg = 'Please enter a valid email address.';
                break;
            case 'auth/invalid-credential':
                msg = 'Invalid email or password. Try again or use "Forgot password".';
                break;
            case 'auth/too-many-requests':
                msg = 'Too many failed attempts. Please wait a few minutes and try again.';
                break;
            case 'auth/operation-not-allowed':
                msg = 'Email/Password login is not enabled. Please contact support.';
                break;
            case 'auth/network-request-failed':
                msg = 'Network error. Please check your internet connection.';
                break;
            default:
                msg = 'Login failed: ' + error.message;
        }
        
        loginError.textContent = msg;
        loginError.classList.add('active');
        loginBtn.textContent = originalText;
        loginBtn.disabled = false;
        loginBtn.style.opacity = '1';
    }
});

// ============ FORGOT PASSWORD ============
forgotForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    loginError.classList.remove('active');
    loginSuccess.classList.remove('active');

    const email = document.getElementById('forgotEmail').value.trim().toLowerCase();
    const forgotBtn = document.getElementById('forgotBtn');

    if (!email) {
        loginError.textContent = 'Please enter your email address.';
        loginError.classList.add('active');
        return;
    }

    const originalText = forgotBtn.textContent;
    forgotBtn.textContent = 'Sending...';
    forgotBtn.disabled = true;
    forgotBtn.style.opacity = '0.7';

    try {
        await sendPasswordResetEmail(auth, email);
        
        loginSuccess.innerHTML = `
            <strong>Reset link sent!</strong><br>
            We've sent a password reset link to <strong>${email}</strong>. 
            Please check your inbox (and spam folder) and follow the instructions.
        `;
        loginSuccess.classList.add('active');
        forgotForm.reset();

        // Auto return to login after 5 seconds
        setTimeout(() => {
            showLoginForm();
        }, 5000);

    } catch (error) {
        console.error('Reset error:', error.code, error.message);

        let msg = 'Failed to send reset link. ';
        switch (error.code) {
            case 'auth/user-not-found':
                msg = 'This email is not registered with us. Please check the email or create an account.';
                break;
            case 'auth/invalid-email':
                msg = 'Please enter a valid email address.';
                break;
            case 'auth/too-many-requests':
                msg = 'Too many requests. Please wait a few minutes and try again.';
                break;
            case 'auth/network-request-failed':
                msg = 'Network error. Please check your internet connection.';
                break;
            default:
                msg = 'Failed: ' + error.message;
        }

        loginError.textContent = msg;
        loginError.classList.add('active');
    } finally {
        forgotBtn.textContent = originalText;
        forgotBtn.disabled = false;
        forgotBtn.style.opacity = '1';
    }
});
</script>

</body>
</html>
