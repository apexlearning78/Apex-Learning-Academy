<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Apex Learning Academy</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #F1F5F9;
            color: #0F172A;
            min-height: 100vh;
        }

        /* ============ LOGIN SCREEN ============ */
        .login-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(160deg, #051429 0%, #0A2540 50%, #1a3a5c 100%);
        }
        .login-box {
            background: #FFFFFF;
            padding: 44px 40px;
            border-radius: 20px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 30px 80px rgba(0,0,0,0.4);
        }
        .login-box h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 26px;
            color: #0A2540;
            font-weight: 800;
            text-align: center;
            margin-bottom: 8px;
        }
        .login-box p {
            font-size: 14.5px;
            color: #64748B;
            text-align: center;
            margin-bottom: 32px;
            font-weight: 500;
        }
        .login-error {
            display: none;
            padding: 14px 18px;
            background: #FEF2F2;
            border-left: 4px solid #EF4444;
            border-radius: 8px;
            color: #991B1B;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .login-error.active { display: block; }

        /* ============ ADMIN PANEL ============ */
        .admin-header {
            background: #0A2540;
            color: #FFFFFF;
            padding: 20px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            box-shadow: 0 4px 20px rgba(10, 37, 64, 0.15);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .admin-brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .admin-brand-logo {
            width: 44px; height: 44px;
            background: linear-gradient(135deg, #F4B400, #d99f00);
            border-radius: 10px;
            overflow: hidden;
        }
        .admin-brand-logo img { width: 100%; height: 100%; object-fit: cover; }
        .admin-brand-text { line-height: 1.2; }
        .admin-brand-title {
            font-family: 'Poppins', sans-serif;
            font-weight: 800;
            font-size: 16px;
            letter-spacing: 1.5px;
        }
        .admin-brand-sub {
            font-size: 10px;
            color: #F4B400;
            letter-spacing: 2px;
            font-weight: 600;
        }
        .admin-user {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .admin-user-email {
            font-size: 13px;
            color: rgba(255,255,255,0.75);
            font-weight: 500;
        }
        .btn-logout-admin {
            padding: 9px 18px;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #FFFFFF;
            font-family: inherit;
            font-size: 13.5px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s;
        }
        .btn-logout-admin:hover {
            background: rgba(255,255,255,0.18);
        }

        .admin-body {
            padding: 32px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Stats */
        .admin-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }
        .admin-stat-card {
            background: #FFFFFF;
            padding: 24px;
            border-radius: 16px;
            border: 1px solid #E2E8F0;
            border-left: 4px solid #F4B400;
            cursor: pointer;
            transition: all 0.25s;
        }
        .admin-stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(10, 37, 64, 0.1);
        }
        .admin-stat-card.active {
            border-left-width: 6px;
            box-shadow: 0 12px 32px rgba(10, 37, 64, 0.15);
        }
        .admin-stat-card.teal { border-left-color: #00A896; }
        .admin-stat-card.red { border-left-color: #DC2626; }
        .admin-stat-card.purple { border-left-color: #7C3AED; }
        .admin-stat-label {
            font-size: 11.5px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #64748B;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .admin-stat-value {
            font-family: 'Poppins', sans-serif;
            font-size: 32px;
            font-weight: 800;
            color: #0A2540;
            line-height: 1;
        }

        /* Panel */
        .admin-panel {
            background: #FFFFFF;
            border-radius: 16px;
            border: 1px solid #E2E8F0;
            overflow: hidden;
        }
        .panel-header {
            padding: 24px 28px;
            border-bottom: 1px solid #E2E8F0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .panel-title {
            font-family: 'Poppins', sans-serif;
            font-size: 18px;
            font-weight: 800;
            color: #0A2540;
        }
        .panel-search {
            padding: 10px 16px;
            border: 2px solid #E2E8F0;
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
            width: 280px;
            max-width: 100%;
            transition: all 0.25s;
        }
        .panel-search:focus {
            outline: none;
            border-color: #F4B400;
        }
        .btn-refresh {
            padding: 10px 20px;
            border-radius: 10px;
            background: #0A2540;
            color: #FFFFFF;
            border: none;
            font-family: inherit;
            font-size: 13.5px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s;
        }
        .btn-refresh:hover { background: #1a3a5c; }

        .panel-body {
            max-height: 600px;
            overflow-y: auto;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        .data-table thead {
            position: sticky;
            top: 0;
            background: #F8FAFC;
            z-index: 2;
        }
        .data-table th {
            padding: 14px 20px;
            text-align: left;
            font-size: 11.5px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #64748B;
            font-weight: 800;
            border-bottom: 1px solid #E2E8F0;
        }
        .data-table td {
            padding: 16px 20px;
            border-bottom: 1px solid #F1F5F9;
            color: #334155;
            font-weight: 500;
            vertical-align: top;
        }
        .data-table tr:hover { background: #F8FAFC; }
        .data-table tr:last-child td { border-bottom: none; }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 100px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge-pending { background: #FEF3C7; color: #92400E; }
        .badge-active { background: #D1FAE5; color: #065F46; }
        .badge-valid { background: #D1FAE5; color: #065F46; }

        .empty-state {
            padding: 60px 20px;
            text-align: center;
            color: #64748B;
        }
        .empty-state svg {
            width: 48px; height: 48px;
            color: #CBD5E1;
            margin-bottom: 16px;
        }
        .empty-state p {
            font-size: 15px;
            font-weight: 500;
        }

        .loading-spinner {
            text-align: center;
            padding: 40px;
            color: #64748B;
            font-size: 14px;
            font-weight: 600;
        }

        .truncate {
            max-width: 220px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .btn-view {
            padding: 6px 12px;
            border-radius: 6px;
            background: #EFF6FF;
            color: #1E40AF;
            border: none;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }
        .btn-view:hover { background: #DBEAFE; }

        .btn-delete {
            padding: 6px 12px;
            border-radius: 6px;
            background: #FEF2F2;
            color: #991B1B;
            border: none;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }
        .btn-delete:hover { background: #FEE2E2; }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 37, 64, 0.7);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .detail-modal {
            background: #FFFFFF;
            border-radius: 20px;
            max-width: 620px;
            width: 100%;
            padding: 32px;
            max-height: 88vh;
            overflow-y: auto;
            position: relative;
        }
        .modal-close {
            position: absolute;
            top: 16px; right: 16px;
            width: 36px; height: 36px;
            border-radius: 50%;
            background: #F1F5F9;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #64748B;
        }
        .modal-close:hover { background: #E2E8F0; }
        .detail-modal h3 {
            font-family: 'Poppins', sans-serif;
            font-size: 22px;
            color: #0A2540;
            font-weight: 800;
            margin-bottom: 22px;
            padding-right: 40px;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 12px 0;
            border-bottom: 1px solid #F1F5F9;
            gap: 20px;
        }
        .detail-row:last-child { border-bottom: none; }
        .detail-label {
            font-size: 11.5px;
            font-weight: 800;
            color: #64748B;
            text-transform: uppercase;
            letter-spacing: 1px;
            flex-shrink: 0;
        }
        .detail-value {
            font-size: 14.5px;
            font-weight: 600;
            color: #0A2540;
            text-align: right;
            word-break: break-word;
        }

        @media (max-width: 768px) {
            .admin-header { padding: 16px 20px; flex-wrap: wrap; }
            .admin-body { padding: 20px; }
            .panel-header { padding: 20px; }
            .data-table th, .data-table td { padding: 12px; font-size: 13px; }
            .admin-stat-value { font-size: 26px; }
        }
    </style>
</head>
<body>

<!-- ============ LOGIN SCREEN ============ -->
<div class="login-screen" id="loginScreen">
    <div class="login-box">
        <div style="text-align: center; margin-bottom: 20px;">
            <div style="width: 60px; height: 60px; margin: 0 auto 16px; background: linear-gradient(135deg, #F4B400, #d99f00); border-radius: 14px; display: flex; align-items: center; justify-content: center; overflow: hidden;">
                <img src="logo.png" alt="Apex" style="width: 100%; height: 100%; object-fit: cover;">
            </div>
            <h1>Admin Panel</h1>
            <p>Login to access the admin dashboard</p>
        </div>

        <div class="login-error" id="loginError"></div>

        <form id="adminLoginForm">
            <div style="margin-bottom: 18px;">
                <label style="display:block; font-size:14px; font-weight:700; color:#0A2540; margin-bottom:8px;">Email</label>
                <input type="email" id="adminEmail" required placeholder="admin@email.com" style="width:100%; padding:13px 16px; border:2px solid #E2E8F0; border-radius:10px; font-family:inherit; font-size:15px;">
            </div>
            <div style="margin-bottom: 24px;">
                <label style="display:block; font-size:14px; font-weight:700; color:#0A2540; margin-bottom:8px;">Password</label>
                <input type="password" id="adminPassword" required placeholder="••••••••" style="width:100%; padding:13px 16px; border:2px solid #E2E8F0; border-radius:10px; font-family:inherit; font-size:15px;">
            </div>
            <button type="submit" id="adminLoginBtn" style="width:100%; padding:15px; border-radius:10px; font-family:'Montserrat',sans-serif; font-weight:800; font-size:15px; cursor:pointer; border:none; background:linear-gradient(135deg,#F4B400,#d99f00); color:#0A2540; box-shadow:0 8px 24px rgba(244,180,0,0.32);">
                Login to Admin Panel
            </button>
        </form>
    </div>
</div>

<!-- ============ ADMIN PANEL ============ -->
<div id="adminPanel" style="display: none;">

    <div class="admin-header">
        <div class="admin-brand">
            <div class="admin-brand-logo"><img src="logo.png" alt="Apex"></div>
            <div class="admin-brand-text">
                <div class="admin-brand-title">ADMIN PANEL</div>
                <div class="admin-brand-sub">APEX LEARNING ACADEMY</div>
            </div>
        </div>
        <div class="admin-user">
            <span class="admin-user-email" id="adminUserEmail">admin@email.com</span>
            <button class="btn-logout-admin" id="adminLogoutBtn">Logout</button>
        </div>
    </div>

    <div class="admin-body">

        <!-- Stats -->
        <div class="admin-stats">
            <div class="admin-stat-card active" data-tab="students" onclick="switchTab('students')">
                <div class="admin-stat-label">Students</div>
                <div class="admin-stat-value" id="statStudents">—</div>
            </div>
            <div class="admin-stat-card teal" data-tab="instructors" onclick="switchTab('instructors')">
                <div class="admin-stat-label">Instructor Applications</div>
                <div class="admin-stat-value" id="statInstructors">—</div>
            </div>
            <div class="admin-stat-card red" data-tab="messages" onclick="switchTab('messages')">
                <div class="admin-stat-label">Contact Messages</div>
                <div class="admin-stat-value" id="statMessages">—</div>
            </div>
            <div class="admin-stat-card purple" data-tab="certificates" onclick="switchTab('certificates')">
                <div class="admin-stat-label">Certificates Issued</div>
                <div class="admin-stat-value" id="statCertificates">—</div>
            </div>
        </div>

        <!-- Panel -->
        <div class="admin-panel">
            <div class="panel-header">
                <div class="panel-title" id="panelTitle">Students</div>
                <input type="text" class="panel-search" id="searchInput" placeholder="Search...">
                <button class="btn-refresh" onclick="loadCurrentTab()">Refresh</button>
            </div>
            <div class="panel-body" id="panelBody">
                <div class="loading-spinner">Loading...</div>
            </div>
        </div>

    </div>
</div>

<!-- ============ DETAIL MODAL ============ -->
<div class="modal-overlay" id="detailModal">
    <div class="detail-modal">
        <button class="modal-close" onclick="closeDetail()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
        </button>
        <h3 id="detailTitle">Details</h3>
        <div id="detailBody"></div>
    </div>
</div>

<script type="module">
import { auth, db } from './firebase-config.js';
import { onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { collection, getDocs, doc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// ==================== ADMIN UID ====================
// ⚠️ YAHAN APNA UID DAALO (Authentication > Users se copy karo)
const ADMIN_UID = 'VHbqYaHK6yXP2f8IF9WKc33kkD73';

// ==================== STATE ====================
let allData = {
    students: [],
    instructors: [],
    messages: [],
    certificates: []
};
let currentTab = 'students';
let currentSearch = '';

// ==================== DOM ====================
const loginScreen = document.getElementById('loginScreen');
const adminPanel = document.getElementById('adminPanel');
const loginError = document.getElementById('loginError');

// ==================== LOGIN ====================
document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    loginError.classList.remove('active');

    const email = document.getElementById('adminEmail').value.trim();
    const password = document.getElementById('adminPassword').value;
    const btn = document.getElementById('adminLoginBtn');

    btn.textContent = 'Logging in...';
    btn.disabled = true;

    try {
        await signInWithEmailAndPassword(auth, email, password);
        // onAuthStateChanged will handle the rest
    } catch (err) {
        console.error(err);
        loginError.textContent = 'Login failed. Please check your credentials.';
        loginError.classList.add('active');
        btn.textContent = 'Login to Admin Panel';
        btn.disabled = false;
    }
});

// ==================== AUTH STATE ====================
onAuthStateChanged(auth, async (user) => {
    if (!user) {
        loginScreen.style.display = 'flex';
        adminPanel.style.display = 'none';
        return;
    }

    // Check karo admin hai ya nahi
    if (user.uid !== ADMIN_UID) {
        await signOut(auth);
        loginError.textContent = 'Access denied. You are not authorized as an admin.';
        loginError.classList.add('active');
        document.getElementById('adminLoginBtn').textContent = 'Login to Admin Panel';
        document.getElementById('adminLoginBtn').disabled = false;
        return;
    }

    // Admin confirmed
    loginScreen.style.display = 'none';
    adminPanel.style.display = 'block';
    document.getElementById('adminUserEmail').textContent = user.email;

    await loadAllData();
});

// ==================== LOGOUT ====================
document.getElementById('adminLogoutBtn').addEventListener('click', async () => {
    await signOut(auth);
    window.location.reload();
});

// ==================== LOAD ALL DATA ====================
async function loadAllData() {
    document.getElementById('panelBody').innerHTML = '<div class="loading-spinner">Loading...</div>';

    try {
        const [studentsSnap, instructorsSnap, messagesSnap, certsSnap] = await Promise.all([
            getDocs(collection(db, 'students')),
            getDocs(collection(db, 'instructorApplications')),
            getDocs(collection(db, 'messages')),
            getDocs(collection(db, 'certificates'))
        ]);

        allData.students = studentsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        allData.instructors = instructorsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        allData.messages = messagesSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        allData.certificates = certsSnap.docs.map(d => ({ id: d.id, ...d.data() }));

        document.getElementById('statStudents').textContent = allData.students.length;
        document.getElementById('statInstructors').textContent = allData.instructors.length;
        document.getElementById('statMessages').textContent = allData.messages.length;
        document.getElementById('statCertificates').textContent = allData.certificates.length;

        renderTab(currentTab);
    } catch (err) {
        console.error('Load error:', err);
        document.getElementById('panelBody').innerHTML = `
            <div class="empty-state">
                <p style="color:#991B1B;">Error loading data: ${err.message}</p>
            </div>`;
    }
}

// ==================== TAB SWITCH ====================
window.switchTab = function(tab) {
    currentTab = tab;
    document.querySelectorAll('.admin-stat-card').forEach(c => c.classList.remove('active'));
    document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
    
    const titles = {
        students: 'Students',
        instructors: 'Instructor Applications',
        messages: 'Contact Messages',
        certificates: 'Certificates Issued'
    };
    document.getElementById('panelTitle').textContent = titles[tab];
    document.getElementById('searchInput').value = '';
    currentSearch = '';
    renderTab(tab);
};

window.loadCurrentTab = function() {
    loadAllData();
};

// ==================== SEARCH ====================
document.getElementById('searchInput').addEventListener('input', (e) => {
    currentSearch = e.target.value.toLowerCase();
    renderTab(currentTab);
});

// ==================== RENDER ====================
function renderTab(tab) {
    const body = document.getElementById('panelBody');
    let data = allData[tab];

    if (currentSearch) {
        data = data.filter(item => JSON.stringify(item).toLowerCase().includes(currentSearch));
    }

    if (data.length === 0) {
        body.innerHTML = `
            <div class="empty-state">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                </svg>
                <p>No ${tab} found${currentSearch ? ' matching your search' : ''}.</p>
            </div>`;
        return;
    }

    if (tab === 'students') renderStudents(data);
    else if (tab === 'instructors') renderInstructors(data);
    else if (tab === 'messages') renderMessages(data);
    else if (tab === 'certificates') renderCertificates(data);
}

function renderStudents(data) {
    const rows = data.map(s => `
        <tr>
            <td><strong>${s.fullName || '—'}</strong></td>
            <td>${s.email || '—'}</td>
            <td>${s.whatsapp || '—'}</td>
            <td><span class="truncate">${s.course || '—'}</span></td>
            <td>${s.city || '—'}</td>
            <td><span class="badge badge-${s.status === 'active' ? 'active' : 'pending'}">${s.status || 'pending'}</span></td>
            <td>
                <button class="btn-view" onclick="viewDetail('students', '${s.id}')">View</button>
                <button class="btn-delete" onclick="deleteItem('students', '${s.id}')">Delete</button>
            </td>
        </tr>
    `).join('');

    document.getElementById('panelBody').innerHTML = `
        <table class="data-table">
            <thead><tr>
                <th>Name</th><th>Email</th><th>WhatsApp</th><th>Course</th><th>City</th><th>Status</th><th>Actions</th>
            </tr></thead>
            <tbody>${rows}</tbody>
        </table>`;
}

function renderInstructors(data) {
    const rows = data.map(i => `
        <tr>
            <td><strong>${i.fullName || '—'}</strong></td>
            <td>${i.email || '—'}</td>
            <td>${i.whatsapp || '—'}</td>
            <td>${i.subject || '—'}</td>
            <td>${i.experience || '—'}</td>
            <td><span class="badge badge-pending">${i.status || 'pending'}</span></td>
            <td>
                <button class="btn-view" onclick="viewDetail('instructors', '${i.id}')">View</button>
                <button class="btn-delete" onclick="deleteItem('instructors', '${i.id}')">Delete</button>
            </td>
        </tr>
    `).join('');

    document.getElementById('panelBody').innerHTML = `
        <table class="data-table">
            <thead><tr>
                <th>Name</th><th>Email</th><th>WhatsApp</th><th>Subject</th><th>Experience</th><th>Status</th><th>Actions</th>
            </tr></thead>
            <tbody>${rows}</tbody>
        </table>`;
}

function renderMessages(data) {
    const rows = data.map(m => `
        <tr>
            <td><strong>${m.name || '—'}</strong></td>
            <td>${m.email || '—'}</td>
            <td><span class="truncate">${m.subject || '—'}</span></td>
            <td><span class="truncate">${m.message || '—'}</span></td>
            <td>${m.type || 'contact'}</td>
            <td>
                <button class="btn-view" onclick="viewDetail('messages', '${m.id}')">View</button>
                <button class="btn-delete" onclick="deleteItem('messages', '${m.id}')">Delete</button>
            </td>
        </tr>
    `).join('');

    document.getElementById('panelBody').innerHTML = `
        <table class="data-table">
            <thead><tr>
                <th>Name</th><th>Email</th><th>Subject</th><th>Message</th><th>Type</th><th>Actions</th>
            </tr></thead>
            <tbody>${rows}</tbody>
        </table>`;
}

function renderCertificates(data) {
    const rows = data.map(c => `
        <tr>
            <td><strong>${c.certificateId || '—'}</strong></td>
            <td>${c.studentName || '—'}</td>
            <td>${c.email || '—'}</td>
            <td><span class="truncate">${c.course || '—'}</span></td>
            <td>${c.issueDate || '—'}</td>
            <td><span class="badge badge-valid">${c.status || 'valid'}</span></td>
            <td>
                <button class="btn-view" onclick="viewDetail('certificates', '${c.id}')">View</button>
                <button class="btn-delete" onclick="deleteItem('certificates', '${c.id}')">Delete</button>
            </td>
        </tr>
    `).join('');

    document.getElementById('panelBody').innerHTML = `
        <table class="data-table">
            <thead><tr>
                <th>Certificate ID</th><th>Student</th><th>Email</th><th>Course</th><th>Issue Date</th><th>Status</th><th>Actions</th>
            </tr></thead>
            <tbody>${rows}</tbody>
        </table>`;
}

// ==================== VIEW DETAIL ====================
window.viewDetail = function(tab, id) {
    const item = allData[tab].find(x => x.id === id);
    if (!item) return;

    const titles = {
        students: 'Student Details',
        instructors: 'Instructor Application',
        messages: 'Message Details',
        certificates: 'Certificate Details'
    };
    document.getElementById('detailTitle').textContent = titles[tab];

    let html = '';
    Object.keys(item).forEach(key => {
        if (key === 'id') return;
        let value = item[key];

        // Firestore timestamp
        if (value && typeof value === 'object' && value.seconds) {
            value = new Date(value.seconds * 1000).toLocaleString();
        } else if (value && typeof value === 'object') {
            value = JSON.stringify(value);
        }

        const label = key.replace(/([A-Z])/g, ' $1').replace(/^./, s => s.toUpperCase());
        html += `
            <div class="detail-row">
                <div class="detail-label">${label}</div>
                <div class="detail-value">${value || '—'}</div>
            </div>`;
    });

    document.getElementById('detailBody').innerHTML = html;
    document.getElementById('detailModal').classList.add('active');
};

window.closeDetail = function() {
    document.getElementById('detailModal').classList.remove('active');
};

document.getElementById('detailModal').addEventListener('click', (e) => {
    if (e.target.id === 'detailModal') closeDetail();
});

// ==================== DELETE ====================
window.deleteItem = async function(tab, id) {
    if (!confirm('Are you sure you want to delete this item? This action cannot be undone.')) return;

    const collectionMap = {
        students: 'students',
        instructors: 'instructorApplications',
        messages: 'messages',
        certificates: 'certificates'
    };

    try {
        await deleteDoc(doc(db, collectionMap[tab], id));
        allData[tab] = allData[tab].filter(x => x.id !== id);
        
        const statMap = {
            students: 'statStudents',
            instructors: 'statInstructors',
            messages: 'statMessages',
            certificates: 'statCertificates'
        };
        document.getElementById(statMap[tab]).textContent = allData[tab].length;
        
        renderTab(tab);
    } catch (err) {
        console.error('Delete error:', err);
        alert('Failed to delete: ' + err.message);
    }
};
</script>
