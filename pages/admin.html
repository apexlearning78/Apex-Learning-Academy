<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="robots"
    content="noindex,nofollow"
  >

  <meta
    name="theme-color"
    content="#071a33"
  >

  <title>Apex Learning Academy | Admin Panel</title>

  <!-- Favicon -->
  <link
    rel="icon"
    type="image/png"
    href="../assets/images/logo.png"
  >

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- Admin CSS -->
  <link
    rel="stylesheet"
    href="../css/pages/admin.css"
  >
</head>

<body>

  <!-- =========================================================
       GLOBAL TOAST
  ========================================================== -->
  <div
    id="toast"
    class="toast"
    role="status"
    aria-live="polite"
  ></div>


  <!-- =========================================================
       LOGIN SCREEN
  ========================================================== -->
  <section
    id="loginScreen"
    class="login-screen"
  >

    <div class="login-card">

      <div class="brand-lockup">

        <img
          src="../assets/images/logo.png"
          alt="Apex Learning Academy"
        >

        <div>
          <strong>APEX</strong>
          <span>LEARNING ACADEMY</span>
        </div>

      </div>


      <div class="login-badge">
        ADMINISTRATOR ACCESS
      </div>


      <h1>
        Admin Panel
      </h1>


      <p>
        Sign in with the authorized academy administrator account.
      </p>


      <form id="loginForm">

        <label>
          Email

          <input
            id="loginEmail"
            type="email"
            autocomplete="username"
            placeholder="admin@example.com"
            required
          >
        </label>


        <label>
          Password

          <input
            id="loginPassword"
            type="password"
            autocomplete="current-password"
            placeholder="Enter your password"
            required
          >
        </label>


        <button
          class="btn primary wide"
          type="submit"
          id="loginBtn"
        >
          Sign in
        </button>

      </form>


      <div
        id="loginError"
        class="form-error"
        role="alert"
      ></div>

    </div>

  </section>



  <!-- =========================================================
       MAIN APPLICATION
  ========================================================== -->
  <div
    id="app"
    class="app"
    hidden
  >

    <!-- =======================================================
         SIDEBAR
    ======================================================== -->
    <aside
      id="sidebar"
      class="sidebar"
    >

      <div class="sidebar-top">

        <div class="brand">

          <img
            src="../assets/images/logo.png"
            alt="Apex Learning Academy"
          >

          <div>
            <strong>APEX</strong>
            <span>ADMIN CENTER</span>
          </div>

        </div>


        <button
          id="closeSidebar"
          class="icon-btn mobile-only"
          type="button"
          aria-label="Close menu"
        >
          ×
        </button>

      </div>


      <!-- Navigation generated by admin.js -->
      <nav
        id="nav"
        class="nav"
        aria-label="Admin navigation"
      ></nav>


      <div class="sidebar-bottom">

        <div class="admin-mini">

          <div
            class="avatar"
            id="adminAvatar"
          >
            A
          </div>

          <div>

            <strong id="adminName">
              Administrator
            </strong>

            <span id="adminEmail">
              —
            </span>

          </div>

        </div>


        <button
          id="logoutBtn"
          class="logout"
          type="button"
        >
          Sign out
        </button>

      </div>

    </aside>



    <!-- =======================================================
         MAIN CONTENT
    ======================================================== -->
    <main class="main">

      <!-- TOP BAR -->
      <header class="topbar">

        <div class="top-left">

          <button
            id="openSidebar"
            class="icon-btn mobile-only"
            type="button"
            aria-label="Open menu"
          >
            ☰
          </button>


          <div>

            <small id="eyebrow">
              ADMIN COMMAND CENTER
            </small>

            <h1 id="pageTitle">
              Dashboard
            </h1>

          </div>

        </div>


        <div class="top-actions">

          <span
            id="syncStatus"
            class="sync"
          >
            Ready
          </span>


          <button
            id="refreshBtn"
            class="btn ghost"
            type="button"
          >
            Refresh
          </button>

        </div>

      </header>



      <!-- =====================================================
           DASHBOARD
      ====================================================== -->
      <section
        id="dashboardView"
        class="view"
      ></section>



      <!-- =====================================================
           MODULE VIEW
      ====================================================== -->
      <section
        id="moduleView"
        class="view"
        hidden
      >

        <div class="module-head">

          <div>

            <h2 id="moduleTitle">
              Students
            </h2>

            <p id="moduleDescription"></p>

          </div>


          <div class="module-actions">

            <input
              id="searchInput"
              class="search"
              type="search"
              placeholder="Search this section"
              autocomplete="off"
            >


            <select
              id="courseFilter"
              class="select"
            >

              <option value="all">
                All courses
              </option>

              <option value="Web Development">
                Web Development
              </option>

              <option value="Artificial Intelligence">
                Artificial Intelligence
              </option>

            </select>


            <button
              id="addBtn"
              class="btn primary"
              type="button"
            >
              Add record
            </button>


            <button
              id="exportBtn"
              class="btn ghost"
              type="button"
            >
              Export CSV
            </button>

          </div>

        </div>


        <!-- Module statistics -->
        <div
          id="moduleStats"
          class="stats mini-stats"
        ></div>


        <!-- Data table -->
        <div class="table-card">

          <div class="table-wrap">

            <table>

              <thead id="tableHead"></thead>

              <tbody id="tableBody"></tbody>

            </table>

          </div>

        </div>

      </section>

    </main>

  </div>



  <!-- =========================================================
       RECORD MODAL
  ========================================================== -->
  <div
    id="recordModal"
    class="modal"
    hidden
  >

    <div class="modal-card large">

      <div class="modal-head">

        <div>

          <small id="modalEyebrow">
            RECORD
          </small>

          <h2 id="modalTitle">
            Add record
          </h2>

        </div>


        <button
          class="close-modal"
          data-close="recordModal"
          type="button"
          aria-label="Close"
        >
          ×
        </button>

      </div>


      <form id="recordForm">

        <div
          id="recordFields"
          class="form-grid"
        ></div>


        <div class="modal-foot">

          <button
            type="button"
            class="btn ghost"
            data-close="recordModal"
          >
            Cancel
          </button>


          <button
            type="submit"
            class="btn primary"
          >
            Save record
          </button>

        </div>

      </form>

    </div>

  </div>



  <!-- =========================================================
       DETAIL MODAL
  ========================================================== -->
  <div
    id="detailModal"
    class="modal"
    hidden
  >

    <div class="modal-card large">

      <div class="modal-head">

        <div>

          <small>
            DETAILS
          </small>

          <h2 id="detailTitle">
            Record
          </h2>

        </div>


        <button
          class="close-modal"
          data-close="detailModal"
          type="button"
          aria-label="Close"
        >
          ×
        </button>

      </div>


      <div
        id="detailBody"
        class="detail-body"
      ></div>


      <div class="modal-foot">

        <button
          class="btn ghost"
          data-close="detailModal"
          type="button"
        >
          Close
        </button>

      </div>

    </div>

  </div>



  <!-- =========================================================
       EMAIL CENTER
  ========================================================== -->
  <div
    id="emailModal"
    class="modal"
    hidden
  >

    <div class="modal-card email-card">

      <div class="modal-head">

        <div>

          <small>
            COMMUNICATION
          </small>

          <h2>
            Email Center
          </h2>

        </div>


        <button
          class="close-modal"
          data-close="emailModal"
          type="button"
          aria-label="Close"
        >
          ×
        </button>

      </div>


      <form id="emailForm">

        <div class="form-grid">

          <!-- RECIPIENTS -->
          <label>

            Recipients

            <select
              id="emailRecipients"
              multiple
              size="7"
            ></select>

            <small>
              Hold Ctrl on Windows or Command on Mac
              to select multiple students.
            </small>

          </label>


          <!-- SUBJECT -->
          <label>

            Subject

            <input
              id="emailSubject"
              type="text"
              placeholder="Email subject"
              autocomplete="off"
              required
            >

          </label>


          <!-- MESSAGE -->
          <label class="full">

            Message

            <textarea
              id="emailBody"
              rows="10"
              placeholder="Write your message..."
              required
            ></textarea>

          </label>

        </div>


        <!-- EMAIL TEMPLATES -->
        <div class="template-row">

          <button
            type="button"
            class="btn ghost"
            data-template="welcome"
          >
            Welcome
          </button>


          <button
            type="button"
            class="btn ghost"
            data-template="fee"
          >
            Fee reminder
          </button>


          <button
            type="button"
            class="btn ghost"
            data-template="certificate"
          >
            Certificate
          </button>


          <button
            type="button"
            class="btn ghost"
            data-template="class"
          >
            Class reminder
          </button>

        </div>


        <!-- EMAIL STATUS -->
        <div
          id="emailStatus"
          class="form-status"
          role="status"
          aria-live="polite"
        ></div>


        <!-- EMAIL ACTIONS -->
        <div class="modal-foot">

          <button
            type="button"
            class="btn ghost"
            data-close="emailModal"
          >
            Cancel
          </button>


          <button
            class="btn primary"
            type="submit"
            id="sendEmailBtn"
          >
            Send email
          </button>

        </div>

      </form>

    </div>

  </div>



  <!-- =========================================================
       CONFIRMATION MODAL
  ========================================================== -->
  <div
    id="confirmModal"
    class="modal"
    hidden
  >

    <div class="modal-card small">

      <div class="modal-head">

        <div>

          <small>
            CONFIRMATION
          </small>

          <h2 id="confirmTitle">
            Confirm action
          </h2>

        </div>

      </div>


      <p id="confirmText"></p>


      <div class="modal-foot">

        <button
          id="confirmCancel"
          class="btn ghost"
          type="button"
        >
          Cancel
        </button>


        <button
          id="confirmOk"
          class="btn danger"
          type="button"
        >
          Confirm
        </button>

      </div>

    </div>

  </div>



  <!-- =========================================================
       EMAILJS BROWSER SDK
       
       IMPORTANT:
       This MUST load before admin.js.
  ========================================================== -->
  <script
    src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"
  ></script>


  <!-- =========================================================
       EMAILJS PRE-INITIALIZATION
       
       This confirms that the EmailJS SDK is actually available
       before admin.js starts.
  ========================================================== -->
  <script>
    window.addEventListener("DOMContentLoaded", function () {

      if (window.emailjs) {

        console.log(
          "%cEmailJS SDK loaded successfully.",
          "color:#16a34a;font-weight:700;"
        );

      } else {

        console.error(
          "EmailJS SDK FAILED to load."
        );

      }

    });
  </script>


  <!-- =========================================================
       ADMIN APPLICATION
  ========================================================== -->
  <script
    type="module"
    src="../js/pages/admin.js"
  ></script>

</body>
</html>
