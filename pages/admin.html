<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#071a33">
<title>Apex Learning Academy | Admin Panel</title>
<link rel="icon" type="image/png" href="../assets/images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/pages/admin.css">
</head>
<body>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<section id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="brand-lockup">
      <img src="../assets/images/logo.png" alt="Apex Learning Academy">
      <div><strong>APEX</strong><span>LEARNING ACADEMY</span></div>
    </div>
    <div class="login-badge">ADMINISTRATOR ACCESS</div>
    <h1>Admin Panel</h1>
    <p>Sign in with the authorized academy administrator account.</p>
    <form id="loginForm">
      <label>Email<input id="loginEmail" type="email" autocomplete="username" required></label>
      <label>Password<input id="loginPassword" type="password" autocomplete="current-password" required></label>
      <button class="btn primary wide" type="submit" id="loginBtn">Sign in</button>
    </form>
    <div id="loginError" class="form-error"></div>
  </div>
</section>

<div id="app" class="app" hidden>
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-top">
      <div class="brand">
        <img src="../assets/images/logo.png" alt="Apex">
        <div><strong>APEX</strong><span>ADMIN CENTER</span></div>
      </div>
      <button id="closeSidebar" class="icon-btn mobile-only" type="button" aria-label="Close menu">×</button>
    </div>
    <nav id="nav" class="nav"></nav>
    <div class="sidebar-bottom">
      <div class="admin-mini"><div class="avatar" id="adminAvatar">A</div><div><strong id="adminName">Administrator</strong><span id="adminEmail">—</span></div></div>
      <button id="logoutBtn" class="logout" type="button">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="top-left">
        <button id="openSidebar" class="icon-btn mobile-only" type="button" aria-label="Open menu">☰</button>
        <div><small id="eyebrow">ADMIN COMMAND CENTER</small><h1 id="pageTitle">Dashboard</h1></div>
      </div>
      <div class="top-actions">
        <span id="syncStatus" class="sync">Ready</span>
        <button id="refreshBtn" class="btn ghost" type="button">Refresh</button>
      </div>
    </header>

    <section id="dashboardView" class="view"></section>
    <section id="moduleView" class="view" hidden>
      <div class="module-head">
        <div><h2 id="moduleTitle">Students</h2><p id="moduleDescription"></p></div>
        <div class="module-actions"><input id="searchInput" class="search" placeholder="Search this section"><select id="courseFilter" class="select"><option value="all">All courses</option><option value="Web Development">Web Development</option><option value="Artificial Intelligence">Artificial Intelligence</option></select><button id="addBtn" class="btn primary" type="button">Add record</button><button id="exportBtn" class="btn ghost" type="button">Export CSV</button></div>
      </div>
      <div id="moduleStats" class="stats mini-stats"></div>
      <div class="table-card"><div class="table-wrap"><table><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table></div></div>
    </section>
  </main>
</div>

<div id="recordModal" class="modal" hidden>
  <div class="modal-card large">
    <div class="modal-head"><div><small id="modalEyebrow">RECORD</small><h2 id="modalTitle">Add record</h2></div><button class="close-modal" data-close="recordModal" type="button">×</button></div>
    <form id="recordForm"><div id="recordFields" class="form-grid"></div><div class="modal-foot"><button type="button" class="btn ghost" data-close="recordModal">Cancel</button><button type="submit" class="btn primary">Save record</button></div></form>
  </div>
</div>

<div id="detailModal" class="modal" hidden>
  <div class="modal-card large"><div class="modal-head"><div><small>DETAILS</small><h2 id="detailTitle">Record</h2></div><button class="close-modal" data-close="detailModal" type="button">×</button></div><div id="detailBody" class="detail-body"></div><div class="modal-foot"><button class="btn ghost" data-close="detailModal" type="button">Close</button></div></div>
</div>

<div id="emailModal" class="modal" hidden>
  <div class="modal-card email-card">
    <div class="modal-head"><div><small>COMMUNICATION</small><h2>Email Center</h2></div><button class="close-modal" data-close="emailModal" type="button">×</button></div>
    <form id="emailForm">
      <div class="form-grid">
        <label>Recipients<select id="emailRecipients" multiple></select><small>Hold Ctrl or Command to select multiple students.</small></label>
        <label>Subject<input id="emailSubject" required></label>
        <label class="full">Message<textarea id="emailBody" rows="10" required></textarea></label>
      </div>
      <div class="template-row"><button type="button" class="btn ghost" data-template="welcome">Welcome</button><button type="button" class="btn ghost" data-template="fee">Fee reminder</button><button type="button" class="btn ghost" data-template="certificate">Certificate</button><button type="button" class="btn ghost" data-template="class">Class reminder</button></div>
      <div id="emailStatus" class="form-status"></div>
      <div class="modal-foot"><button type="button" class="btn ghost" data-close="emailModal">Cancel</button><button class="btn primary" type="submit">Send email</button></div>
    </form>
  </div>
</div>

<div id="confirmModal" class="modal" hidden>
  <div class="modal-card small"><div class="modal-head"><div><small>CONFIRMATION</small><h2 id="confirmTitle">Confirm action</h2></div></div><p id="confirmText"></p><div class="modal-foot"><button id="confirmCancel" class="btn ghost" type="button">Cancel</button><button id="confirmOk" class="btn danger" type="button">Confirm</button></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script type="module" src="../js/pages/admin.js"></script>
</body>
</html>
